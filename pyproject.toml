[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyrolisten"
version = "0.2.2"
description = "listen() and ask() for Pyrogram, Kurigram and other Pyrogram forks"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Maharam Ali Khan", email = "psupdates74@gmail.com" },
]
keywords = ["telegram", "pyrogram", "kurigram", "conversation", "listen", "ask"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# No hard dependency on purpose: most Pyrogram forks install the same `pyrogram`
# module, so a required one would clash with the fork the user already has.
# Users pick their library with an extra instead, e.g. pip install "pyrolisten[kurigram]".
dependencies = []

[project.optional-dependencies]
pyrogram = ["pyrogram"]
kurigram = ["kurigram"]

[project.urls]
Homepage = "https://github.com/ps-updates/pyrolisten"
Issues = "https://github.com/ps-updates/pyrolisten/issues"

[tool.hatch.build.targets.wheel]
packages = ["pyrolisten"]
